<!DOCTYPE html>
<html>

<head>
    <title>Farmer_Association</title>
<style>
body {
//background-image:linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)),url("n.jpg");
background-image:center;
background-image:no-repeat;
}
h1{
color:red;
text-align:center;
font-size:60px;
padding-top:10px;
padding-bottom:10px;
}
label
{
color:black;
font:weight:900;
text-align:right;
padding-right:30px;
}

</style>
</head>

<body>

    <header>
        <h1>Farmer Association Form</h1>
    </header>
<form>
<label id="s">Farmer Name</label>
<input type="text"placeholder="Enter Farmer Name"><br><br>
<label>Email</label>
<input type="email"placeholder="Enter Email"><br><br>
<label>Password</label>
<input type="password"placeholder="Enter password"><br><br>
<label>phone No</label>
<input type="number"placeholder="Enter Number"><br><br>
<label>Sate Name</label>
<input type="text"placeholder="Enter State Name"><br><br>
<label>Gender</label>
<br><br>
<input type="radio" name="gender" value="Male">
<label>Male</label><br><br>

<input type="radio"name="gender"value="Female">
<label>Female</label><br><br>

<input type="radio"name="gender"value=None">
<label>None</label><br><br>
<label>Which crops You like</label><br><br>
<input type="checkbox" value="paddy">
<label>Paddy</label><br><br>
<input type="checkbox" value="vegetable">
<label>vegetable</label><br><br>
<input type="checkbox" value="cotton">
<label>Cotton</label><br><br>
<input type="checkbox" value="wheat">
<label>Wheat</label><br><br>
<input type="checkbox" value="sugarcane">
<label>Sugarcane</label><br><br>
<p>How much profits for  one crop</p>
<select>
<option>None</option>
<option>10000</option>
<option>15000</option>
<option>20000</option>
<option>Other</option>
</select>
<br><br>
<p>Address</p>
<textarea rows="5" cols="40" placeholder="Enter your Address">
</textarea>
<br><br>
<label>Join the Farmers association </label>
<input type="radio" name="Join the Farmers association " value="Yes">
<label>Yes</label>
<input type="radio" name="Join the Farmers association " value="No">
<label>No</label>
<br><br>
<button type="submit">Submit</button>
<br><br>
<button type="reset">Clear all</button>

<br><br>
    <footer>
        <p>© 2026 Introduction to Agriculture </p>
    </footer>
<br><br>
<br><br>
<br><br>
</form>
</body>

</html>
